<style>
/* 404 pubblica di produkts.it (GitHub Pages la usa per ogni indirizzo inesistente): percorsi assoluti, nessun link alla bozza */
html,body{overflow-x:clip;max-width:100%}
html{scrollbar-gutter:stable both-edges}
body{margin:0;background:#080808}
@media (max-width:640px){[style*="px 56px"],[style*="padding: 0 56px"]{padding-left:16px!important;padding-right:16px!important}}
a{color:#E8E4DF;text-decoration:none}a:hover{color:#D98A4E}
a:focus-visible{outline:1px solid #D98A4E;outline-offset:4px}
::selection{color:#B46428;background:transparent}
[style*="#B46428"]::selection{color:#336699;background:transparent}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pull{0%{filter:blur(22px);opacity:0;transform:scale(1.06)}55%{filter:blur(0);opacity:1;transform:scale(1)}72%{filter:blur(4px)}100%{filter:blur(1.6px)}}
@keyframes hunt{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.2}}
@keyframes ring{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.blurry{animation:pull 2.6s cubic-bezier(.3,.6,.2,1) .2s both;transition:filter .6s ease}
.stage:hover .blurry{filter:blur(0)!important}
.hunt{animation:hunt 3.2s ease-in-out infinite}
.af{animation:blink 1s steps(1) infinite}
.ring{animation:ring 24s linear infinite;transform-origin:50% 50%}
.fade{animation:fade 1s ease 1.6s both}
.btn{transition:background .3s,color .3s}
.btn:hover{background:#B46428!important;color:#080808!important}
@media (max-width:640px){.stage .meta{display:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.blurry{filter:blur(1.6px)}}
</style>
</head>
<body>
<div style="background: #080808; color: #E8E4DF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; flex-direction: column">
<header style="max-width: 1440px; width: 100%; margin: 0 auto; padding: 28px 56px; box-sizing: border-box">
<a href="/" style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 30px">produkts<span style="font-style: normal; opacity: 0.5">.it</span></a>
</header>
<main class="stage" style="flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: 24px 56px 72px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center">
<div style="position: relative; width: 100%; max-width: 960px; aspect-ratio: 2.39 / 1; display: flex; align-items: center; justify-content: center">
<div class="hunt" aria-hidden="true" style="position: absolute; inset: 0">
<span style="position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-top: 1px solid #336699; border-left: 1px solid #336699"></span>
<span style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border-top: 1px solid #336699; border-right: 1px solid #336699"></span>
<span style="position: absolute; bottom: 0; left: 0; width: 44px; height: 44px; border-bottom: 1px solid #336699; border-left: 1px solid #336699"></span>
<span style="position: absolute; bottom: 0; right: 0; width: 44px; height: 44px; border-bottom: 1px solid #336699; border-right: 1px solid #336699"></span>
</div>
<svg class="ring" aria-hidden="true" width="280" height="280" viewBox="0 0 280 280" fill="none" style="position: absolute; opacity: 0.35; max-width: 72vw; height: auto"><circle cx="140" cy="140" r="132" stroke="#336699" stroke-width="1" stroke-dasharray="2 10"></circle></svg>
<span class="meta" style="position: absolute; top: 16px; left: 64px; font-size: 12px; letter-spacing: 0.16em; color: #9A948C; display: flex; align-items: center; gap: 10px"><span class="af" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #B46428"></span>AF · ricerca fuoco</span>
<span class="meta" style="position: absolute; bottom: 16px; right: 64px; font-size: 12px; letter-spacing: 0.16em; color: #9A948C">ERR 404</span>
<h1 class="blurry" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(140px, 22vw, 320px); line-height: 1; letter-spacing: -0.02em">404</h1>
</div>
<div class="fade" style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 44px; line-height: 1.1">Fuori fuoco.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9C4BD; max-width: 420px">Questa pagina non esiste o è stata spostata. Rimettiamo a fuoco da qui.</p>
</div>
<div class="fade" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
<a href="/" class="btn" style="padding: 16px 28px; background: #E8E4DF; color: #080808; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Torna alla home</a>
<a href="https://www.youtube.com/watch?v=nLLtk0Lwxq8" target="_blank" rel="noopener" style="padding: 15px 28px; border: 1px solid #3A3A3A; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Guarda Dynamis <span aria-hidden="true">↗</span></a>
</div>
</main>
</div>
<script>
function pkCursor(){
  var d=document,w=window;
  if(!w.matchMedia||!w.matchMedia('(hover: hover) and (pointer: fine)').matches)return null;
  if(!w.PointerEvent||d.getElementById('pk-cursor'))return null;
  var still=w.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var st=d.createElement('style');st.id='pk-cursor-css';
  st.textContent='#pk-cursor{position:fixed;left:0;top:0;width:28px;height:28px;border:1px solid rgba(232,228,223,.75);border-radius:50%;pointer-events:none;z-index:2147483647;opacity:0;transition:opacity .3s ease,border-color .3s,background-color .3s;will-change:transform,width,height;box-sizing:border-box}'
   +'#pk-cursor.lock{border-color:#D98A4E;background-color:rgba(217,138,78,.06)}#pk-cursor.lens{border-color:rgba(232,228,223,.35)}'
   +'@media (hover:none),(pointer:coarse){#pk-cursor{display:none!important}}';
  d.head.appendChild(st);
  var c=d.createElement('div');c.id='pk-cursor';c.setAttribute('aria-hidden','true');d.body.appendChild(c);
  var SEL='a,button,select,input,textarea,label,summary,[role="button"]',BSEL='h1,h2,h3,.kicker,.kw,[data-blur],span[style*="text-transform: uppercase"],span[style*="text-transform:uppercase"]';
  var PAD=7,MIN=46,EASE='cubic-bezier(.2,.7,.2,1)';
  var mx=-100,my=-100,x=-100,y=-100,W=28,H=28,R=14,lock=null,mode='',raf,visible=false;
  var blurred=null,blurAnim=null,muted=null;
  var k=still?1:0.16,ks=still?1:0.2;
  function blurOn(el){
    if(blurAnim){blurAnim.cancel();}
    blurAnim=el.animate([{filter:'blur(0px)',opacity:1},{filter:'blur(2.4px)',opacity:.85}],{duration:220,easing:EASE,fill:'forwards'});
  }
  function blurOff(el,instant){
    if(!el)return;
    var a=blurAnim;blurAnim=null;
    if(instant){if(a)a.cancel();return;}
    var cur=a?getComputedStyle(el).filter:'blur(2.4px)';
    var out=el.animate([{filter:cur==='none'?'blur(0px)':cur,opacity:getComputedStyle(el).opacity},{filter:'blur(0px)',opacity:1}],{duration:260,easing:EASE});
    if(a)a.cancel();
    out.onfinish=function(){out.cancel()};
  }
  function setBlur(el,instant){
    if(el===blurred)return;
    if(blurred)blurOff(blurred,instant);
    blurred=el;
    if(el)blurOn(el);
  }
  function hide(){visible=false;c.style.opacity='0';lock=null;setBlur(null,true);}
  function radiusOf(el,h){var r=parseFloat(getComputedStyle(el).borderTopLeftRadius)||0;return Math.min(r+PAD,h/2)}
  function move(e){
    if(e.pointerType!=='mouse'){hide();return;}
    mx=e.clientX;my=e.clientY;
    if(!visible){visible=true;x=mx;y=my;c.style.opacity='1';}
    var t=e.target&&e.target.closest?e.target.closest(SEL):null;
    var bl=!t&&e.target&&e.target.closest?e.target.closest(BSEL):null;
    if(muted&&bl!==muted)muted=null;
    if(bl&&bl===muted)bl=null;
    lock=t;setBlur(still?null:bl);
    var m=t?'lock':bl?'lens':'';
    if(m!==mode){mode=m;c.className=m;}
  }
  function down(e){
    if(e.pointerType!=='mouse'){hide();return;}
    if(blurred){muted=blurred;setBlur(null,false);if(mode==='lens'){mode='';c.className='';}}
  }
  function loop(){
    var tx,ty,tw,th,tr;
    if(lock&&lock.isConnected){
      var r=lock.getBoundingClientRect(),cxe=r.left+r.width/2,cye=r.top+r.height/2;
      if(r.width+PAD*2>MIN||r.height+PAD*2>MIN){tw=Math.max(r.width+PAD*2,MIN);th=Math.max(r.height+PAD*2,MIN);tr=radiusOf(lock,th);}
      else{tw=th=MIN;tr=MIN/2;}
      tx=cxe+(mx-cxe)*0.08;ty=cye+(my-cye)*0.08;
    }else{tx=mx;ty=my;var s=mode==='lens'?72:28;tw=th=s;tr=s/2;}
    x+=(tx-x)*k;y+=(ty-y)*k;W+=(tw-W)*ks;H+=(th-H)*ks;R+=(tr-R)*ks;
    c.style.width=W.toFixed(1)+'px';c.style.height=H.toFixed(1)+'px';c.style.borderRadius=R.toFixed(1)+'px';
    c.style.transform='translate3d('+(x-W/2).toFixed(2)+'px,'+(y-H/2).toFixed(2)+'px,0)';
    raf=requestAnimationFrame(loop);
  }
  d.addEventListener('pointermove',move,{passive:true});
  d.addEventListener('pointerdown',down,{passive:true});
  d.addEventListener('touchstart',hide,{passive:true});
  d.documentElement.addEventListener('mouseleave',hide);
  w.addEventListener('blur',hide);
  raf=requestAnimationFrame(loop);
  return function(){cancelAnimationFrame(raf);d.removeEventListener('pointermove',move);d.removeEventListener('pointerdown',down);d.removeEventListener('touchstart',hide);d.documentElement.removeEventListener('mouseleave',hide);w.removeEventListener('blur',hide);setBlur(null,true);c.remove();st.remove();};
}
pkCursor();
</script>
</body>
