  function p(n){return (n<10?'0':'')+n}
  function tick(){
    var now=new Date(), h, m, s;
    if (fmt && fmt.formatToParts) {
      var parts=fmt.formatToParts(now);
      for (var i=0;i<parts.length;i++){ var t=parts[i]; if(t.type==='hour')h=t.value; else if(t.type==='minute')m=t.value; else if(t.type==='second')s=t.value; }
