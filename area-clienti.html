<script src="assets/site.js?v=93eaf6b2"></script>
<script>
/* Area clienti: controlla il codice e apre la galleria privata */
(function(){
var d=document,input=d.getElementById('ac-code'),err=d.querySelector('.ac-err'),btn=d.querySelector('[data-act="enter"]');
function errore(m){err.textContent=m||'';err.hidden=!m}
async function entra(){
  var c=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length<6)return errore('Scrivi il codice che ti ho mandato.');
  errore('');btn.setAttribute('aria-busy','true');
  try{var r=await fetch('/api/galleria?verifica=1&c='+encodeURIComponent(c)),j=await r.json();
    if(!r.ok)return errore(j.errore||'Codice non valido.');
    location.href='galleria?c='+c;
  }catch(e){errore('Connessione assente, riprova tra poco.')}
  finally{btn.removeAttribute('aria-busy')}
}
PK.acts.enter=entra;
input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();entra()}});
})();
</script>
