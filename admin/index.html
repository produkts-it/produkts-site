<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pannello — produkts.it</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Installabile sul telefono: "Aggiungi a schermata Home" apre il pannello come un'app -->
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pannello">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080808">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Space+Grotesk:wght@400;500&display=swap">
<style>
/* Pagina riservata (Cloudflare Access): richieste dal modulo Contatti e moderazione delle recensioni */
:root{--bg:#080808;--line:#1F1F1F;--fg:#E8E4DF;--muted:#9A948C;--ember:#B46428;--steel:#336699}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:32px 16px 80px}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:48px;margin:0 0 8px}
h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:32px;margin:48px 0 16px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:24px}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);padding:12px 0;font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--fg);border-bottom-color:var(--ember)}
.item{border:1px solid var(--line);padding:20px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.item.nuovo{border-color:var(--steel)}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta b{color:var(--ember);font-weight:500}
.testo{white-space:pre-wrap;line-height:1.6;color:#C9C4BD;overflow-wrap:anywhere}
.az{display:flex;flex-wrap:wrap;gap:8px}
.az button{height:40px;padding:0 16px;border:1px solid #3A3A3A;background:transparent;color:var(--fg);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.az a.wa{display:inline-flex;align-items:center;height:40px;padding:0 16px;background:var(--fg);color:var(--bg);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.az button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.push{margin-top:24px;padding:16px 20px;border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;line-height:1.5}
.push.on{border-color:var(--steel)}
.push[hidden]{display:none}
.gcampi{display:flex;flex-wrap:wrap;gap:12px}
.gcampi label{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcampi input{height:44px;background:var(--bg);border:1px solid #3A3A3A;color:var(--fg);padding:0 12px;font:inherit;font-size:15px;letter-spacing:normal;text-transform:none;min-width:0}
.gcampi input:focus{outline:none;border-color:var(--ember)}
.gesito{margin:0;font-size:14px;line-height:1.5}.gesito.ok{color:#9BC59D}.gesito.err{color:#D98A4E}
.gcod{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}.gcod span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcod b{font-size:22px;letter-spacing:.18em;font-weight:500}.gcod a{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item.spenta{opacity:.55}
.gdata{display:flex;gap:8px}.gdata input{flex:1;color-scheme:dark}
.gdata button{height:44px;padding:0 14px;border:1px solid #3A3A3A;background:transparent;color:var(--fg);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.gedit{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.gsez{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.gsez small{color:var(--muted);margin-left:8px}.gsez .az button{width:40px;padding:0}
.gsez .az button:disabled{opacity:.25;cursor:default}
.gminis{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:360px;overflow:auto}
.gmini{padding:0;border:2px solid transparent;background:#161616;cursor:pointer;aspect-ratio:1;overflow:hidden}
.gmini img{width:100%;height:100%;object-fit:cover;display:block}.gmini.sel{border-color:var(--ember)}
.gfuoco{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.gfpick{position:relative;flex:1 1 280px;max-width:420px;cursor:crosshair;touch-action:none;line-height:0}
.gfpick img{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
.gfdot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--ember),0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.gfprev{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;max-width:320px}
.gfprev span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gfpc,.gfmob{background-size:cover;background-repeat:no-repeat;border:1px solid var(--line)}
.gfpc{width:100%;aspect-ratio:2.39/1}.gfmob{width:120px;aspect-ratio:4/5}
.vuoto,.err{color:var(--muted);margin-top:24px}
.err{color:#D98A4E}
a{color:var(--fg)}
.login[hidden]{display:none}
.login{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;max-width:520px}
.login label{display:flex;flex-direction:column;gap:8px;flex:1 1 260px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.login input{height:48px;background:var(--bg);border:1px solid #3A3A3A;color:var(--fg);padding:0 14px;font:inherit;font-size:15px;letter-spacing:normal;text-transform:none}
.login input:focus{outline:none;border-color:var(--ember)}
.login button{height:48px;padding:0 24px;background:var(--fg);color:var(--bg);border:0;font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>Pannello</h1>
<p style="margin:0;color:var(--muted)">Richieste dal sito, recensioni da approvare e gallerie dei clienti. Le recensioni compaiono sul sito solo dopo "Approva".</p>
<div class="push" id="push" hidden>
<span id="push-stato">Ricevi una notifica su questo dispositivo quando arriva una richiesta o una recensione.</span>
<span class="az"><button type="button" id="push-on">Attiva notifiche</button><button type="button" id="push-prova" hidden>Prova</button></span>
</div>
<div class="tabs" role="group" aria-label="Sezione">
<button type="button" data-tab="recensioni" aria-pressed="true">Recensioni</button>
<button type="button" data-tab="contatti" aria-pressed="false">Contatti</button>
<button type="button" data-tab="gallerie" aria-pressed="false">Gallerie</button>
<button type="button" id="esci" style="margin-left:auto" hidden>Esci</button>
</div>
<form class="login" id="login" hidden>
<label>Password del pannello<input type="password" id="pw" autocomplete="current-password" required></label>
<button type="submit">Entra</button>
</form>
<div id="lista"></div>
</div>
<script>
(function(){
var lista=document.getElementById('lista'),login=document.getElementById('login'),esci=document.getElementById('esci'),tab='recensioni';
/* La password resta salvata su questo dispositivo (localStorage), così il pannello aperto dalla Home del telefono non la richiede ogni volta;
   viaggia solo in HTTPS verso le API del pannello. "Esci" la cancella. */
function pw(){try{return localStorage.getItem('pk-admin')||''}catch(e){return ''}}
login.addEventListener('submit',function(ev){ev.preventDefault();try{localStorage.setItem('pk-admin',document.getElementById('pw').value)}catch(e){}login.hidden=true;carica()});
esci.addEventListener('click',function(){try{localStorage.removeItem('pk-admin')}catch(e){}esci.hidden=true;document.getElementById('push').hidden=true;lista.innerHTML='';login.hidden=false;document.getElementById('pw').value=''});
/* Link dalle notifiche Telegram: /admin/#contatti o /admin/#recensioni apre la sezione giusta */
function daHash(){var h=location.hash.slice(1);if(h==='contatti'||h==='recensioni'||h==='gallerie'){tab=h;document.querySelectorAll('[data-tab]').forEach(function(t){t.setAttribute('aria-pressed',t.dataset.tab===h)})}}
daHash();window.addEventListener('hashchange',function(){daHash();carica()});
/* Numero per wa.me: solo cifre, prefisso 39 se manca */
function wa(t){var n=t.replace(/[^\d+]/g,'');return n.charAt(0)==='+'?n.slice(1):n.slice(0,2)==='00'?n.slice(2):'39'+n}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function data(s){var d=new Date(s.replace(' ','T')+'Z');return d.toLocaleString('it-IT',{timeZone:'Europe/Rome',dateStyle:'medium',timeStyle:'short'})}
async function api(path,body){
  var h={'x-admin-password':pw()};if(body)h['content-type']='application/json';
  var r=await fetch('/api/admin/'+path,body?{method:'POST',headers:h,body:JSON.stringify(body)}:{headers:h});
  if(r.status===401){login.hidden=false;esci.hidden=true;document.getElementById('pw').focus();var err=new Error(pw()?'Password errata.':'Inserisci la password del pannello.');err.login=true;throw err}
  if(!r.ok){var j=await r.json().catch(function(){return {}});throw new Error(j.errore||('Errore '+r.status))}
  esci.hidden=!pw();mostraPush();
  return r.json();
}
/* Notifiche push su questo dispositivo (admin/sw.js + functions/_push.js). Su iPhone funzionano solo dal pannello aperto dall'icona sulla Home. */
var push=document.getElementById('push'),pStato=document.getElementById('push-stato'),pOn=document.getElementById('push-on'),pProva=document.getElementById('push-prova');
var pushOk='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window,reg=null;
if(pushOk)navigator.serviceWorker.register('/admin/sw.js',{scope:'/admin/'}).then(function(r){reg=r;statoPush()}).catch(function(){});
function chiaveBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s+'==='.slice((s.length+3)%4)),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function mostraPush(){
  if(!push.hidden)return;push.hidden=false;
  if(!pushOk){pOn.hidden=true;pStato.textContent=/iPhone|iPad/.test(navigator.userAgent)?'Per le notifiche apri il pannello dall’icona sulla schermata Home (Condividi → Aggiungi a schermata Home).':'Questo browser non supporta le notifiche.'}
}
async function statoPush(){
  if(!reg)return;var sub=await reg.pushManager.getSubscription(),on=!!sub&&Notification.permission==='granted';
  push.classList.toggle('on',on);pProva.hidden=!on;pOn.textContent=on?'Disattiva':'Attiva notifiche';
  pStato.textContent=on?'Notifiche attive su questo dispositivo.':Notification.permission==='denied'?'Notifiche bloccate: riattivale dalle impostazioni del telefono per questo sito o app, poi ricarica.':'Ricevi una notifica su questo dispositivo quando arriva una richiesta o una recensione.';
}
pOn.addEventListener('click',async function(){
  try{
    var sub=reg&&await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){await api('push/disiscrivi',{endpoint:sub.endpoint});await sub.unsubscribe();return statoPush()}
    var perm=await Notification.requestPermission();
    if(perm!=='granted')return statoPush();
    reg=reg||await navigator.serviceWorker.ready;
    var k=await api('push/chiave'),opz={userVisibleOnly:true,applicationServerKey:chiaveBytes(k.chiave)};
    try{sub=await reg.pushManager.subscribe(opz)}catch(e){var vecchia=await reg.pushManager.getSubscription();if(!vecchia)throw e;await vecchia.unsubscribe();sub=await reg.pushManager.subscribe(opz)}
    await api('push/iscrivi',sub.toJSON());
    await statoPush();prova();
  }catch(err){pStato.textContent='Non sono riuscito ad attivare le notifiche: '+err.message}
});
async function prova(){
  try{var r=await api('push/prova',{});pStato.textContent=r.ok?'Notifica di prova inviata: dovrebbe arrivarti tra pochi secondi.':'La notifica di prova non è partita ('+(r.esiti.map(function(x){return x.servizio+' '+x.stato}).join(', ')||'nessun dispositivo')+').'}
  catch(err){pStato.textContent=err.message}
}
pProva.addEventListener('click',prova);
async function carica(){
  lista.innerHTML='<p class="vuoto">Caricamento…</p>';
  try{
    var rows=await api(tab);
    if(tab==='gallerie'){lista.innerHTML=FORM_G+(rows.length?rows.map(gal).join(''):'<p class="vuoto">Ancora nessuna galleria.</p>');return}
    if(!rows.length){lista.innerHTML='<p class="vuoto">Ancora niente qui.</p>';return}
    lista.innerHTML=rows.map(tab==='recensioni'?rec:con).join('');
  }catch(err){lista.innerHTML='<p class="err">'+e(err.message)+'</p>'}
}
/* Gallerie clienti: le foto restano su Aruba Drive (cartella madre condivisa con link, sottocartelle = sezioni) */
var SITO=location.origin;
var FORM_G='<form class="item gform" id="gform" style="border-color:var(--steel)"><div class="meta"><b>Nuova galleria</b><span>Su Aruba Drive: cartella madre → Condividi → Condividi tramite link, poi incolla qui il link</span></div>'
 +'<div class="gcampi"><label>Cliente<input name="cliente" required placeholder="Nome e cognome"></label><label>Evento<input name="titolo" placeholder="Comunione, 18 anni…"></label>'
 +'<label>Data<span class="gdata"><input name="data" type="date"><button type="button" data-goggi="1">Oggi</button></span></label><label style="flex-basis:100%">Link Aruba Drive<input name="link" required placeholder="https://….arubadrive.com/s/…"></label></div>'
 +'<div class="az"><button type="submit" class="on">Crea galleria</button></div><p class="gesito" hidden></p></form>';
function linkG(g){return SITO+'/galleria?c='+g.codice}
function waG(g){return 'https://wa.me/?text='+encodeURIComponent('Ciao '+g.cliente.split(' ')[0]+'! Le tue foto sono pronte.\nLe trovi qui: '+linkG(g)+'\n\nSe te lo chiede, il codice è: '+g.codice)}
function gal(g){
  return '<div class="item'+(g.attiva?'':' spenta')+'"><div class="meta"><b>'+(g.attiva?'attiva':'spenta')+'</b><span>creata '+e(data(g.creato))+'</span>'
   +'<span>'+(g.aperta?'aperta '+e(data(g.aperta))+' · '+g.aperture+' visite':'non ancora aperta')+'</span>'+(g.download?'<span>'+g.download+' download</span>':'')+'</div>'
   +'<div style="font-size:18px">'+e(g.cliente)+(g.titolo||g.data?' <span style="color:var(--muted)">· '+e([g.titolo,g.data].filter(Boolean).join(' · '))+'</span>':'')+'</div>'
   +'<div class="gcod"><span>Codice</span><b>'+e(g.codice)+'</b><a href="'+e(linkG(g))+'" target="_blank" rel="noopener">'+e(linkG(g).replace(/^https?:\/\//,''))+'</a></div>'
   +'<div class="az"><a class="wa" href="'+e(waG(g))+'" target="_blank" rel="noopener">Manda su WhatsApp</a>'
   +'<button type="button" data-gcopia="'+e(linkG(g))+'">Copia link</button>'
   +'<button type="button" data-gal="'+g.id+'" data-gatt="'+(g.attiva?0:1)+'">'+(g.attiva?'Spegni':'Riattiva')+'</button>'
   +'<button type="button" data-gal="'+g.id+'" data-gcod="1">Nuovo codice</button>'
   +'<button type="button" data-gal="'+g.id+'" data-gdel="1">Elimina</button>'
   +'<button type="button" data-gedit="'+g.id+'" data-gcodice="'+e(g.codice)+'">Ordine e copertina</button></div>'
   +'<div class="gedit" id="ged-'+g.id+'" hidden></div></div>';
}
document.addEventListener('submit',async function(ev){
  if(ev.target.id!=='gform')return;ev.preventDefault();
  var f=ev.target,es=f.querySelector('.gesito'),b=f.querySelector('button[type=submit]'),dati={};
  ['cliente','titolo','data','link'].forEach(function(k){dati[k]=f.elements[k].value});
  if(/^\d{4}-\d{2}-\d{2}$/.test(dati.data))dati.data=dati.data.split('-').reverse().join('.'); /* 2026-10-18 → 18.10.2026 */
  b.disabled=true;b.textContent='Controllo il link…';es.hidden=true;
  try{var r=await api('gallerie',dati);carica();setTimeout(function(){var n=document.querySelector('.gform .gesito');if(n){n.hidden=false;n.className='gesito ok';n.textContent='Galleria creata: '+r.foto+' foto in '+r.sezioni.length+' sezioni ('+r.sezioni.join(', ')+'). Ora mandala al cliente con il pulsante WhatsApp qui sotto.'}},300)}
  catch(err){es.hidden=false;es.className='gesito err';es.textContent=err.message}
  finally{b.disabled=false;b.textContent='Crea galleria'}
});
/* Editor di una galleria: ordine delle sottocartelle (frecce) e foto di copertina (clic su una miniatura) */
var ED={};
function mini(id,p,lato){return '/api/galleria/anteprima?c='+encodeURIComponent(ED[id].codice)+'&s='+(lato||240)+'&p='+encodeURIComponent(p)}
/* Punto di focus della copertina (come Pixieset): tocca o trascina sulla foto; le anteprime mostrano il taglio da computer e da telefono */
function fuocoHtml(id){
  var st=ED[id],u=mini(id,st.copertina,480),f=st.fuoco||'50% 50%',xy=f.split(' ');
  return '<div class="gfuoco"><div class="gfpick" data-gfuoco="'+id+'"><img src="'+e(u)+'" alt="Copertina: tocca il punto da tenere a fuoco" draggable="false"><span class="gfdot" style="left:'+xy[0]+';top:'+xy[1]+'"></span></div>'
   +'<div class="gfprev"><span>Computer</span><div class="gfpc" style="background-image:url(\''+e(u)+'\');background-position:'+f+'"></div>'
   +'<span>Telefono</span><div class="gfmob" style="background-image:url(\''+e(u)+'\');background-position:'+f+'"></div></div></div>';
}
function mettiFuoco(id,el,ev){
  var r=el.getBoundingClientRect(),x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));
  var f=x.toFixed(1)+'% '+y.toFixed(1)+'%',box=document.getElementById('ged-'+id);ED[id].fuoco=f;
  box.querySelector('.gfdot').style.left=x.toFixed(1)+'%';box.querySelector('.gfdot').style.top=y.toFixed(1)+'%';
  box.querySelectorAll('.gfpc,.gfmob').forEach(function(p){p.style.backgroundPosition=f});
}
var trascina=null;
document.addEventListener('pointerdown',function(ev){var el=ev.target.closest('[data-gfuoco]');if(!el)return;trascina=el;el.setPointerCapture(ev.pointerId);mettiFuoco(el.dataset.gfuoco,el,ev);ev.preventDefault()});
document.addEventListener('pointermove',function(ev){if(trascina)mettiFuoco(trascina.dataset.gfuoco,trascina,ev)});
document.addEventListener('pointerup',function(){trascina=null});
function disegnaEd(id){
  var st=ED[id],box=document.getElementById('ged-'+id);
  var sez=st.sezioni.map(function(x,i){return '<div class="gsez"><span>'+e(x.nome||'Altre foto')+' <small>'+x.foto.length+' foto</small></span><span class="az">'
    +'<button type="button" data-gsu="'+id+'" data-i="'+i+'"'+(i?'':' disabled')+' aria-label="Sposta su">↑</button>'
    +'<button type="button" data-ggiu="'+id+'" data-i="'+i+'"'+(i<st.sezioni.length-1?'':' disabled')+' aria-label="Sposta giù">↓</button></span></div>'}).join('');
  var cur=st.sezioni[st.vista]||st.sezioni[0];
  var tabs=st.sezioni.map(function(x,i){return '<button type="button" data-gvista="'+id+'" data-i="'+i+'"'+(i===st.vista?' class="on"':'')+'>'+e(x.nome||'Altre foto')+'</button>'}).join('');
  var foto=cur.foto.map(function(p){return '<button type="button" class="gmini'+(p===st.copertina?' sel':'')+'" data-gcop="'+id+'" data-p="'+e(p)+'"><img src="'+e(mini(id,p))+'" alt="" loading="lazy"></button>'}).join('');
  box.innerHTML='<div class="meta"><b>Ordine delle sezioni</b><span>come le vede il cliente</span></div>'+sez
    +'<div class="meta" style="margin-top:16px"><b>Copertina</b><span>scegli la foto qui sotto, poi tocca sulla copertina il punto da tenere a fuoco</span></div>'
    +(st.copertina?fuocoHtml(id):'')
    +'<div class="az">'+tabs+'</div><div class="gminis">'+foto+'</div>'
    +'<div class="az"><button type="button" class="on" data-gsalva="'+id+'">Salva ordine e copertina</button><span class="gesito ok" data-gok="'+id+'"></span></div>';
}
async function apriEd(id,codice){
  var box=document.getElementById('ged-'+id);
  if(!box.hidden){box.hidden=true;return}
  box.hidden=false;box.innerHTML='<p class="vuoto">Leggo la cartella su Aruba…</p>';
  try{var r=await api('gallerie/'+id);ED[id]={codice:r.codice,sezioni:r.sezioni,copertina:r.copertina,fuoco:r.fuoco,vista:0};disegnaEd(id)}
  catch(err){box.innerHTML='<p class="err">'+e(err.message)+'</p>'}
}
function rec(r){
  return '<div class="item'+(r.stato==='attesa'?' nuovo':'')+'"><div class="meta"><b>'+e(r.stato)+'</b><span>'+e(data(r.creato))+'</span><span>'+'★'.repeat(r.voto)+'</span><span>'+e(r.servizio)+'</span></div>'
   +'<div style="font-size:18px">'+e((r.nome+' '+(r.cognome||'')).trim())+'</div><div class="testo">'+e(r.testo)+'</div>'
   +'<div class="az"><button type="button" data-rec="'+r.id+'" data-stato="approvata"'+(r.stato==='approvata'?' class="on"':'')+'>Approva</button>'
   +'<button type="button" data-rec="'+r.id+'" data-stato="rifiutata"'+(r.stato==='rifiutata'?' class="on"':'')+'>Rifiuta</button>'
   +'<button type="button" data-rec="'+r.id+'" data-evid="'+(r.in_evidenza?0:1)+'"'+(r.in_evidenza?' class="on"':'')+'>In evidenza</button></div></div>';
}
function con(c){
  /* Dal 10/2026 il recapito è il telefono (le richieste più vecchie possono avere un'email) */
  var tel=!/@/.test(c.recapito);
  var rec=tel?'<a href="tel:'+e(c.recapito.replace(/[^\d+]/g,''))+'">'+e(c.recapito)+'</a>':'<a href="mailto:'+e(c.recapito)+'">'+e(c.recapito)+'</a>';
  var waBtn=tel?'<a class="wa" href="https://wa.me/'+e(wa(c.recapito))+'" target="_blank" rel="noopener">Scrivi su WhatsApp</a>':'';
  return '<div class="item'+(c.letto?'':' nuovo')+'"><div class="meta"><b>'+(c.letto?'letto':'nuovo')+'</b><span>'+e(data(c.creato))+'</span>'
   +(c.tipo?'<span>'+e(c.tipo)+'</span>':'')+(c.budget?'<span>'+e(c.budget)+'</span>':'')+(c.quando?'<span>'+e(c.quando)+'</span>':'')+(c.dove?'<span>'+e(c.dove)+'</span>':'')+'</div>'
   +'<div style="font-size:18px">'+e((c.nome+' '+(c.cognome||'')).trim())+' · '+rec+'</div><div class="testo">'+e(c.messaggio)+'</div>'
   +'<div class="az">'+waBtn+'<button type="button" data-con="'+c.id+'" data-letto="'+(c.letto?0:1)+'">'+(c.letto?'Segna come nuovo':'Segna come letto')+'</button></div></div>';
}
document.addEventListener('click',async function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(function(t){t.setAttribute('aria-pressed',t===b)});carica();return}
  try{
    if(b.dataset.goggi){var t=new Date(),z=function(n){return String(n).padStart(2,'0')};b.previousElementSibling.value=t.getFullYear()+'-'+z(t.getMonth()+1)+'-'+z(t.getDate());return}
    if(b.dataset.gedit){apriEd(b.dataset.gedit,b.dataset.gcodice);return}
    if(b.dataset.gsu||b.dataset.ggiu){var id=b.dataset.gsu||b.dataset.ggiu,i=+b.dataset.i,j=b.dataset.gsu?i-1:i+1,a=ED[id].sezioni,t2=a[i];a[i]=a[j];a[j]=t2;disegnaEd(id);return}
    if(b.dataset.gvista){ED[b.dataset.gvista].vista=+b.dataset.i;disegnaEd(b.dataset.gvista);return}
    if(b.dataset.gcop){ED[b.dataset.gcop].copertina=b.dataset.p;ED[b.dataset.gcop].fuoco='50% 50%';disegnaEd(b.dataset.gcop);return}
    if(b.dataset.gsalva){var id2=b.dataset.gsalva;await api('gallerie/'+id2,{ordine:ED[id2].sezioni.map(function(x){return x.nome}),copertina:ED[id2].copertina,fuoco:ED[id2].fuoco||'50% 50%'});
      var ok=document.querySelector('[data-gok="'+id2+'"]');if(ok)ok.textContent='Salvato. Il cliente vede il nuovo ordine entro pochi minuti.';return}
    if(b.dataset.gcopia){try{await navigator.clipboard.writeText(b.dataset.gcopia);b.textContent='Copiato'}catch(x){prompt('Copia il link:',b.dataset.gcopia)}return}
    if(b.dataset.gal){
      if(b.dataset.gdel&&!confirm('Eliminare questa galleria? Le foto su Aruba Drive restano dove sono.'))return;
      if(b.dataset.gcod&&!confirm('Creare un nuovo codice? Il link e il codice vecchi smetteranno di funzionare.'))return;
      await api('gallerie/'+b.dataset.gal,b.dataset.gdel?{elimina:true}:b.dataset.gcod?{nuovoCodice:true}:{attiva:b.dataset.gatt==='1'});
      carica();return;
    }
    if(b.dataset.rec)await api('recensioni/'+b.dataset.rec,b.dataset.stato?{stato:b.dataset.stato}:{in_evidenza:b.dataset.evid==='1'});
    else if(b.dataset.con)await api('contatti/'+b.dataset.con,{letto:b.dataset.letto==='1'});
    else return;
    carica();
  }catch(err){lista.insertAdjacentHTML('afterbegin','<p class="err">'+e(err.message)+'</p>')}
});
carica();
})();
</script>
