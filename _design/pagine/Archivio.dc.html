<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Produkts — Lavori</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=Space+Grotesk:wght@400;500&amp;display=swap">
<style>
html,body{overflow-x:clip;max-width:100%}
@media (max-width:640px){[style*="px 56px"],[style*="padding: 0 56px"]{padding-left:16px!important;padding-right:16px!important}}
body{margin:0;background:#080808}
a{color:#E8E4DF;text-decoration:none}a:hover{color:#D98A4E}
@keyframes curtain{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
@keyframes wm{0%{opacity:0}30%,70%{opacity:1}100%{opacity:0}}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.curtain{animation:curtain .9s cubic-bezier(.8,0,.2,1) .55s both}
.curtain .wm{animation:wm .9s ease both}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) 1.2s both}
.fade{animation:fade 1s ease 1.5s both}
.intro{animation:fade .9s ease both}
.work .frame{transition:transform .7s cubic-bezier(.2,.7,.2,1),background .5s}
.work:hover .frame{transform:scale(1.02);background:#1B1B1B}
.work .br{transition:all .45s cubic-bezier(.2,.7,.2,1)}
.work:hover .br-tl{top:8px!important;left:8px!important;width:36px!important;height:36px!important;border-color:#B46428!important}
.work:hover .br-br{bottom:8px!important;right:8px!important;width:36px!important;height:36px!important;border-color:#B46428!important}
.work .arr{display:inline-block;opacity:0;transform:translateX(-8px);transition:all .4s}
.work:hover .arr{opacity:1;transform:none}
@keyframes vtin{from{opacity:0;transform:scale(.85) translateY(30px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes vtout{to{opacity:0;transform:scale(.85);filter:blur(6px)}}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:.85s;animation-timing-function:cubic-bezier(.7,0,.15,1)}
::view-transition-new(*):only-child{animation:vtin .7s cubic-bezier(.2,.7,.2,1) .25s both}
::view-transition-old(*):only-child{animation:vtout .4s cubic-bezier(.7,0,.8,.3) both}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover}
@keyframes mopen{from{clip-path:circle(0% at calc(100% - 90px) 52px)}to{clip-path:circle(150% at calc(100% - 90px) 52px)}}
@keyframes mclose{from{clip-path:circle(150% at calc(100% - 90px) 52px)}to{clip-path:circle(0% at calc(100% - 90px) 52px)}}
@keyframes mlink{from{opacity:0;transform:translateY(60%) skewY(4deg)}to{opacity:1;transform:none}}
@keyframes pv{from{opacity:0;letter-spacing:.4em}to{opacity:1}}
.mo{animation:mopen .9s cubic-bezier(.77,0,.18,1) both}
.mo.closing{animation:mclose .6s cubic-bezier(.77,0,.18,1) both}
.ml{animation:mlink .8s cubic-bezier(.2,.7,.1,1) both}
.ml .mt{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1),color .3s}
.ml:hover .mt,.ml:focus-visible .mt{transform:translateX(24px);color:#D98A4E!important}
.mfade{animation:fade .8s ease .7s both}
.pv{animation:pv .5s ease both}
.mb .l1,.mb .l2{transition:width .4s cubic-bezier(.2,.7,.2,1)}
.mb:hover .l1{width:16px!important}.mb:hover .l2{width:28px!important}
.mx .x1,.mx .x2{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mx:hover .x1{transform:rotate(135deg)!important}.mx:hover .x2{transform:rotate(45deg)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="background: #080808; color: #E8E4DF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh">
<div aria-hidden="true" class="curtain" style="position: fixed; inset: 0; background: #0E0E0E; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; border-bottom: 1px solid #B46428"><span class="wm" style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 40px">Lavori</span></div>

<header><dc-import name="Menu" current="lavori" accent="{{accent}}" hint-size="100%,104px"></dc-import></header>

<section style="max-width: 1440px; margin: 0 auto; padding: 72px 56px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 64px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(64px, 10vw, 160px); line-height: 0.9; overflow: hidden; padding-bottom: 0.08em"><span class="rise" style="display: block">Lavori</span></h1>
<p class="fade" style="margin: 0; flex: 0 1 400px; font-size: 17px; line-height: 1.6; color: #C9C4BD">Cortometraggi, videoclip ed eventi. Per ogni lavoro: il mio ruolo, il set, le scelte di luce.</p>
</section>

<section style="max-width: 1440px; margin: 0 auto; padding: 0 56px; box-sizing: border-box">
<div class="fade" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid #1F1F1F; padding-bottom: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 4px 28px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="background: transparent; border: 0; border-bottom: 1px solid {{t.line}}; color: {{t.color}}; padding: 12px 0; font-family: 'Space Grotesk', sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">{{t.label}} <sup style="font-size: 10px; color: #6E6A64">{{t.n}}</sup></button>
</sc-for>
</div>
<span style="font-size: 13px; color: #9A948C; font-variant-numeric: tabular-nums">{{count}} lavori</span>
</div>
</section>

<section aria-label="Elenco lavori" style="max-width: 1440px; margin: 0 auto; padding: 48px 56px 120px; box-sizing: border-box">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 56px 32px">
<sc-for list="{{works}}" as="w" hint-placeholder-count="9">
<a href="Work.dc.html" class="{{w.cls}}" style="view-transition-name: {{w.vt}}; display: flex; flex-direction: column; gap: 16px; animation-delay: {{w.delay}}">
<div class="frame" style="position: relative; aspect-ratio: 2.39 / 1; background: #161616; display: flex; align-items: center; justify-content: center; overflow: hidden">
<img src="{{w.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%">
<span aria-hidden="true" class="br br-tl" style="position: absolute; top: 12px; left: 12px; width: 16px; height: 16px; border-top: 1px solid #336699; border-left: 1px solid #336699"></span>
<span aria-hidden="true" class="br br-br" style="position: absolute; bottom: 12px; right: 12px; width: 16px; height: 16px; border-bottom: 1px solid #336699; border-right: 1px solid #336699"></span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 28px; line-height: 1.15">{{w.t}} <span aria-hidden="true" class="arr" style="color: {{accent}}">→</span></h2>
<span style="font-size: 13px; color: #9A948C; white-space: nowrap">{{w.year}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A948C">
<span style="color: {{accent}}">{{w.kind}}</span><span>{{w.role}}</span>
</div>
</a>
</sc-for>
</div>
</section>

<footer style="border-top: 1px solid #1F1F1F">
<div style="max-width: 1440px; margin: 0 auto; padding: 24px 56px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: #9A948C">
<span>© 2026 Produkts · Karim Ismail · Altamura (BA)</span>
<a href="Privacy.dc.html" style="color: #9A948C">Privacy e cookie</a>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B46428","options":["#B46428","#336699","#E8E4DF"]},"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Tutti', filtered: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#B46428';
    const all = [
      { t: 'Dynamis', kind: 'Cortometraggio', also: 'Opera personale', role: 'Produttore e D.O.P. · VerticalMovie 2026', year: '2026', img: '/_blob/16326ab405ac768b24d27e6e70b03f4f' }
    ].map((w, i) => Object.assign({ id: i }, w));
    const cats = ['Tutti', 'Cortometraggio', 'Opera personale'];
    const labels = { 'Tutti': 'Tutti', 'Cortometraggio': 'Cortometraggi', 'Videoclip': 'Videoclip', 'Evento': 'Eventi', 'Opera personale': 'Opere personali' };
    const cat = this.state.cat;
    const inCat = (w, c) => w.kind === c || w.also === c;
    const list = cat === 'Tutti' ? all : all.filter((w) => inCat(w, cat));
    const filterTo = (c) => {
      if (c === cat) return;
      const apply = () => new Promise((done) => this.setState({ cat: c, filtered: true }, done));
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (document.startViewTransition && !reduce) document.startViewTransition(apply);
      else apply();
    };
    return {
      accent: accent,
      count: String(list.length),
      tabs: cats.map((c) => ({
        label: labels[c],
        n: String(c === 'Tutti' ? all.length : all.filter((w) => inCat(w, c)).length),
        pressed: c === cat ? 'true' : 'false',
        color: c === cat ? '#E8E4DF' : '#9A948C',
        line: c === cat ? accent : 'transparent',
        pick: () => filterTo(c)
      })),
      works: list.map((w, i) => ({
        t: w.t, kind: w.also ? w.kind + ' · ' + w.also : w.kind, role: w.role, year: w.year, img: w.img,
        vt: 'w' + w.id,
        cls: this.state.filtered ? 'work' : 'work intro',
        delay: (1.6 + i * 0.08).toFixed(2) + 's'
      }))
    };
  }
}
</script>
</body>
</html>
