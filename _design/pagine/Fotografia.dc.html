<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Produkts — Fotografia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=Space+Grotesk:wght@400;500&amp;display=swap">
<style>
html,body{overflow-x:clip;max-width:100%}
@media (max-width:640px){[style*="px 56px"],[style*="padding: 0 56px"]{padding-left:16px!important;padding-right:16px!important}}
body{margin:0;background:#080808}
a{color:#E8E4DF;text-decoration:none}a:hover{color:#D98A4E}
@keyframes curtain{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
@keyframes wm{0%{opacity:0}30%,70%{opacity:1}100%{opacity:0}}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.curtain{animation:curtain .9s cubic-bezier(.8,0,.2,1) .55s both}
.curtain .wm{animation:wm .9s ease both}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) 1.2s both}
.fade{animation:fade 1s ease 1.5s both}
.intro{animation:fade .9s ease both}
.ph .img{transition:transform .9s cubic-bezier(.2,.7,.2,1),background .5s}
.ph:hover .img{transform:scale(1.03);background:#1D1D1D}
.ph .cap{opacity:0;transform:translateY(8px);transition:all .4s}
.ph:hover .cap,.ph:focus-visible .cap{opacity:1;transform:none}
.lbx{animation:fadein .35s ease both}
.lbx .big{animation:zoom .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes vtin{from{opacity:0;transform:scale(.85) translateY(30px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes vtout{to{opacity:0;transform:scale(.85);filter:blur(6px)}}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:.85s;animation-timing-function:cubic-bezier(.7,0,.15,1)}
::view-transition-new(*):only-child{animation:vtin .7s cubic-bezier(.2,.7,.2,1) .25s both}
::view-transition-old(*):only-child{animation:vtout .4s cubic-bezier(.7,0,.8,.3) both}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover}
@keyframes mopen{from{clip-path:circle(0% at calc(100% - 90px) 52px)}to{clip-path:circle(150% at calc(100% - 90px) 52px)}}
@keyframes mclose{from{clip-path:circle(150% at calc(100% - 90px) 52px)}to{clip-path:circle(0% at calc(100% - 90px) 52px)}}
@keyframes mlink{from{opacity:0;transform:translateY(60%) skewY(4deg)}to{opacity:1;transform:none}}
@keyframes pv{from{opacity:0;letter-spacing:.4em}to{opacity:1}}
.mo{animation:mopen .9s cubic-bezier(.77,0,.18,1) both}
.mo.closing{animation:mclose .6s cubic-bezier(.77,0,.18,1) both}
.ml{animation:mlink .8s cubic-bezier(.2,.7,.1,1) both}
.ml .mt{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1),color .3s}
.ml:hover .mt,.ml:focus-visible .mt{transform:translateX(24px);color:#D98A4E!important}
.mfade{animation:fade .8s ease .7s both}
.pv{animation:pv .5s ease both}
.mb .l1,.mb .l2{transition:width .4s cubic-bezier(.2,.7,.2,1)}
.mb:hover .l1{width:16px!important}.mb:hover .l2{width:28px!important}
.mx .x1,.mx .x2{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mx:hover .x1{transform:rotate(135deg)!important}.mx:hover .x2{transform:rotate(45deg)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="background: #080808; color: #E8E4DF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh">
<div aria-hidden="true" class="curtain" style="position: fixed; inset: 0; background: #0E0E0E; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; border-bottom: 1px solid #B46428"><span class="wm" style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 40px">Fotografia</span></div>
<header><dc-import name="Menu" current="foto" accent="{{accent}}" hint-size="100%,104px"></dc-import></header>

<section style="max-width: 1440px; margin: 0 auto; padding: 72px 56px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 64px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(64px, 10vw, 160px); line-height: 0.9; overflow: hidden; padding-bottom: 0.08em"><span class="rise" style="display: block">Fotografia</span></h1>
<p class="fade" style="margin: 0; flex: 0 1 400px; font-size: 17px; line-height: 1.6; color: #C9C4BD">Ritratti, eventi, matrimoni e fotografie di scena. La stessa attenzione alla luce che porto sul set.</p>
</section>

<section style="max-width: 1440px; margin: 0 auto; padding: 0 56px; box-sizing: border-box">
<div class="fade" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid #1F1F1F; padding-bottom: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 4px 28px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="background: transparent; border: 0; border-bottom: 1px solid {{t.line}}; color: {{t.color}}; padding: 12px 0; font-family: 'Space Grotesk', sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<span style="font-size: 13px; color: #9A948C; font-variant-numeric: tabular-nums">{{count}} foto</span>
</div>
</section>

<section aria-label="Fotografie" style="max-width: 1440px; margin: 0 auto; padding: 32px 56px 120px; box-sizing: border-box">
<div style="column-width: 320px; column-gap: 16px">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="12">
<button type="button" class="{{p.cls}}" onClick="{{p.open}}" aria-label="Apri {{p.label}}" style="view-transition-name: {{p.vt}}; display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 0; background: transparent; cursor: zoom-in; break-inside: avoid; position: relative; overflow: hidden; animation-delay: {{p.delay}}">
<div class="img" style="aspect-ratio: {{p.ratio}}; background: #161616; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.1em; color: #6E6A64">{{p.label}}</div>
<span class="cap" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: linear-gradient(transparent, rgba(8,8,8,0.85)); display: flex; justify-content: space-between; font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #E8E4DF"><span>{{p.cat}}</span><span aria-hidden="true">+</span></span>
</button>
</sc-for>
</div>
</section>

<footer style="border-top: 1px solid #1F1F1F">
<div style="max-width: 1440px; margin: 0 auto; padding: 24px 56px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: #9A948C">
<span>© 2026 Produkts · Karim Ismail · Altamura (BA)</span>
<a href="Privacy.dc.html" style="color: #9A948C">Privacy e cookie</a>
</div>
</footer>

<sc-if value="{{lightbox}}" hint-placeholder-val="{{ false }}">
<div class="lbx" role="dialog" aria-modal="true" aria-label="Foto ingrandita" style="position: fixed; inset: 0; z-index: 90; background: rgba(5,5,5,0.97); display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 28px; font-size: 13px; letter-spacing: 0.14em; color: #9A948C">
<span style="font-variant-numeric: tabular-nums">{{pos}} · {{curCat}}</span>
<button type="button" onClick="{{close}}" aria-label="Chiudi" style="width: 44px; height: 44px; background: transparent; border: 1px solid #3A3A3A; border-radius: 50%; color: #E8E4DF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px 40px">
<button type="button" onClick="{{prev}}" aria-label="Foto precedente" style="width: 52px; height: 52px; flex: none; background: transparent; border: 0; color: #E8E4DF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div class="big" key="{{curKey}}" style="height: 100%; max-height: 78vh; max-width: 100%; aspect-ratio: {{curRatio}}; background: #161616; display: flex; align-items: flex-end; padding: 18px; box-sizing: border-box; font-size: 13px; letter-spacing: 0.1em; color: #6E6A64">{{curLabel}}</div>
<button type="button" onClick="{{next}}" aria-label="Foto successiva" style="width: 52px; height: 52px; flex: none; background: transparent; border: 0; color: #E8E4DF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B46428","options":["#B46428","#336699","#E8E4DF"]},"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Tutte', idx: -1, filtered: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#B46428';
    const cats = ['Ritratti', 'Eventi', 'Matrimoni', 'Still dal set'];
    const ratios = ['4 / 5', '3 / 2', '2 / 3', '3 / 2', '4 / 5', '2 / 3', '3 / 2', '4 / 5', '3 / 2', '2 / 3', '4 / 5', '3 / 2', '2 / 3', '3 / 2', '4 / 5', '2.39 / 1'];
    const all = ratios.map((r, i) => ({ id: i, ratio: r, cat: cats[i % 4], label: '[ FOTO ' + String(i + 1).padStart(2, '0') + ' ]' }));
    const cat = this.state.cat;
    const list = cat === 'Tutte' ? all : all.filter((p) => p.cat === cat);
    const idx = this.state.idx;
    const cur = idx >= 0 && idx < list.length ? list[idx] : null;
    const go = (d) => () => this.setState({ idx: (idx + d + list.length) % list.length });
    const filterTo = (c) => {
      if (c === cat) return;
      const apply = () => new Promise((done) => this.setState({ cat: c, idx: -1, filtered: true }, done));
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (document.startViewTransition && !reduce) document.startViewTransition(apply);
      else apply();
    };
    return {
      accent: accent,
      count: String(list.length),
      tabs: ['Tutte'].concat(cats).map((c) => ({
        label: c,
        pressed: c === cat ? 'true' : 'false',
        color: c === cat ? '#E8E4DF' : '#9A948C',
        line: c === cat ? accent : 'transparent',
        pick: () => filterTo(c)
      })),
      photos: list.map((p, i) => ({
        ratio: p.ratio, label: p.label, cat: p.cat,
        vt: 'f' + p.id,
        cls: this.state.filtered ? 'ph' : 'ph intro',
        delay: (1.6 + i * 0.07).toFixed(2) + 's',
        open: () => this.setState({ idx: i })
      })),
      lightbox: !!cur,
      close: () => this.setState({ idx: -1 }),
      prev: go(-1),
      next: go(1),
      pos: cur ? String(idx + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0') : '',
      curCat: cur ? cur.cat : '',
      curKey: cur ? cur.label : 'none',
      curRatio: cur ? cur.ratio : '3 / 2',
      curLabel: cur ? cur.label : ''
    };
  }
}
</script>
</body>
</html>
