<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Produkts — Pagina non trovata</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=Space+Grotesk:wght@400;500&amp;display=swap">
<style>
html,body{overflow-x:clip;max-width:100%}
@media (max-width:640px){[style*="px 56px"],[style*="padding: 0 56px"]{padding-left:16px!important;padding-right:16px!important}}
body{margin:0;background:#080808}
a{color:#E8E4DF;text-decoration:none}a:hover{color:#D98A4E}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pull{0%{filter:blur(22px);opacity:0;transform:scale(1.06)}55%{filter:blur(0);opacity:1;transform:scale(1)}72%{filter:blur(4px)}100%{filter:blur(1.6px)}}
@keyframes hunt{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.2}}
@keyframes ring{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.blurry{animation:pull 2.6s cubic-bezier(.3,.6,.2,1) .2s both;transition:filter .6s ease}
.stage:hover .blurry{filter:blur(0)!important}
.hunt{animation:hunt 3.2s ease-in-out infinite}
.af{animation:blink 1s steps(1) infinite}
.ring{animation:ring 24s linear infinite;transform-origin:50% 50%}
.fade{animation:fade 1s ease 1.6s both}
.btn{transition:background .3s,color .3s}
.btn:hover{background:#B46428!important;color:#080808!important}
@keyframes mopen{from{clip-path:circle(0% at calc(100% - 90px) 52px)}to{clip-path:circle(150% at calc(100% - 90px) 52px)}}
@keyframes mclose{from{clip-path:circle(150% at calc(100% - 90px) 52px)}to{clip-path:circle(0% at calc(100% - 90px) 52px)}}
@keyframes mlink{from{opacity:0;transform:translateY(60%) skewY(4deg)}to{opacity:1;transform:none}}
@keyframes pv{from{opacity:0;letter-spacing:.4em}to{opacity:1}}
.mo{animation:mopen .9s cubic-bezier(.77,0,.18,1) both}
.mo.closing{animation:mclose .6s cubic-bezier(.77,0,.18,1) both}
.ml{animation:mlink .8s cubic-bezier(.2,.7,.1,1) both}
.ml .mt{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1),color .3s}
.ml:hover .mt,.ml:focus-visible .mt{transform:translateX(24px);color:#D98A4E!important}
.mfade{animation:fade .8s ease .7s both}
.pv{animation:pv .5s ease both}
.mb .l1,.mb .l2{transition:width .4s cubic-bezier(.2,.7,.2,1)}
.mb:hover .l1{width:16px!important}.mb:hover .l2{width:28px!important}
.mx .x1,.mx .x2{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mx:hover .x1{transform:rotate(135deg)!important}.mx:hover .x2{transform:rotate(45deg)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.blurry{filter:blur(1.6px)}}
</style>
</helmet>
<div style="background: #080808; color: #E8E4DF; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; flex-direction: column">
<header><dc-import name="Menu" current="" accent="{{accent}}" hint-size="100%,104px"></dc-import></header>

<main class="stage" style="flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: 24px 56px 72px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center">
<div style="position: relative; width: 100%; max-width: 960px; aspect-ratio: 2.39 / 1; display: flex; align-items: center; justify-content: center">
<div class="hunt" aria-hidden="true" style="position: absolute; inset: 0">
<span style="position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-top: 1px solid #336699; border-left: 1px solid #336699"></span>
<span style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border-top: 1px solid #336699; border-right: 1px solid #336699"></span>
<span style="position: absolute; bottom: 0; left: 0; width: 44px; height: 44px; border-bottom: 1px solid #336699; border-left: 1px solid #336699"></span>
<span style="position: absolute; bottom: 0; right: 0; width: 44px; height: 44px; border-bottom: 1px solid #336699; border-right: 1px solid #336699"></span>
</div>
<svg class="ring" aria-hidden="true" width="280" height="280" viewBox="0 0 280 280" fill="none" style="position: absolute; opacity: 0.35; max-width: 72vw; height: auto"><circle cx="140" cy="140" r="132" stroke="#336699" stroke-width="1" stroke-dasharray="2 10"></circle></svg>
<span style="position: absolute; top: 16px; left: 64px; font-size: 12px; letter-spacing: 0.16em; color: #9A948C; display: flex; align-items: center; gap: 10px"><span class="af" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span>AF · ricerca fuoco</span>
<span style="position: absolute; bottom: 16px; right: 64px; font-size: 12px; letter-spacing: 0.16em; color: #9A948C">ERR 404</span>
<h1 class="blurry" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(140px, 22vw, 320px); line-height: 1; letter-spacing: -0.02em">404</h1>
</div>
<div class="fade" style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 44px; line-height: 1.1">Fuori fuoco.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9C4BD; max-width: 420px">Questa pagina non esiste o è stata spostata. Rimettiamo a fuoco da qui.</p>
</div>
<div class="fade" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
<a href="Main.dc.html" class="btn" style="padding: 16px 28px; background: #E8E4DF; color: #080808; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Torna alla home</a>
<a href="Archivio.dc.html" style="padding: 15px 28px; border: 1px solid #3A3A3A; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Guarda i lavori</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B46428","options":["#B46428","#336699","#E8E4DF"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B46428' };
  }
}
</script>
</body>
</html>
