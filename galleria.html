</button>
<div class="g-notch" style="position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 20px; border-radius: 32px; background: rgba(8,8,8,0.78); border: 1px solid #2A2A2A; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); white-space: nowrap; max-width: calc(100vw - 24px); box-sizing: border-box">
<span class="g-pos" style="font-size: 12px; letter-spacing: 0.12em; color: #C9C4BD; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; min-width: 0"></span>

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Scarica</a>
<button type="button" data-act="close" aria-label="Chiudi" style="width: 44px; height: 44px; flex: none; background: transparent; border: 1px solid #3A3A3A; border-radius: 50%; color: #E8E4DF; cursor: pointer; display: flex; align-items: center; justify-content: center">

<script src="assets/site.js?v=93eaf6b2"></script>
<script>
/* Galleria privata: foto lette da Aruba Drive attraverso /api/galleria (vedi functions/api/galleria e functions/_aruba.js) */
(function(){
var d=document,w=window,api='/api/galleria',codice='',G=null,foto=[],list=[],cur=null,idx=-1,lastFocus=null;
var vLock=d.querySelector('[data-if="locked"]'),vOpen=d.querySelector('[data-if="open"]'),box=d.querySelector('[data-if="lightbox"]');
var pos=box.querySelector('.g-pos'),big=box.querySelector('.big'),dl=box.querySelector('.g-dl');
var input=d.getElementById('g-code'),err=d.querySelector('.g-err'),btn=d.querySelector('[data-act="enter"]');
var griglia=d.querySelector('.g-griglia'),tabs=d.querySelector('.g-tabs'),zip=d.querySelector('.g-zip'),zipT=d.querySelector('.g-zip-t');
function q(u,x){return api+u+'?c='+encodeURIComponent(codice)+(x||'')}
function prev(f,lato){return q('/anteprima','&s='+lato+'&p='+encodeURIComponent(f.p))}
function orig(f){return q('/foto','&p='+encodeURIComponent(f.p))}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function errore(m){err.textContent=m||'';err.hidden=!m}
function vista(aperta){vLock.hidden=aperta;vOpen.hidden=!aperta;w.scrollTo(0,0)}

async function apri(c){
  c=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length<6){errore('Scrivi il codice che ti ho mandato.');return}
  errore('');btn.setAttribute('aria-busy','true');btn.textContent='Apro la galleria…';
  try{
    var r=await fetch(api+'?c='+encodeURIComponent(c)),j=await r.json();
    if(!r.ok){vista(false);errore(j.errore||'Codice non valido.');return}
    codice=c;G=j;try{sessionStorage.setItem('pk-galleria',c)}catch(e){}
    try{history.replaceState(null,'','galleria?c='+c)}catch(e){}
    disegna();PK.vt(function(){vista(true)});
  }catch(e){vista(false);errore('Connessione assente, riprova tra poco.')}
  finally{btn.removeAttribute('aria-busy');btn.textContent='Apri la galleria'}
}

function disegna(){
  d.title=G.cliente+' — produkts.it';
  d.querySelector('.g-nome').textContent=G.cliente;
  d.querySelector('.g-kick').textContent=[G.titolo,G.data].filter(Boolean).join(' · ')||'Galleria privata';
  foto=[];G.sezioni.forEach(function(s){s.foto.forEach(function(f){f.sez=s.nome;foto.push(f)})});
  var cop=d.querySelector('.g-cover'),cf=G.copertina?{p:G.copertina}:foto[0];cop.onload=function(){cop.style.opacity=1};cop.style.objectPosition=G.fuoco||'50% 50%';if(cf)cop.src=prev(cf,1600);
  var nomi=G.sezioni.map(function(s){return s.nome});
  tabs.innerHTML=nomi.length>1?['Tutte'].concat(nomi).map(function(n,i){var v=i?n:null;return '<button type="button" data-sez="'+(i?esc(n):'')+'" data-tutte="'+(i?0:1)+'" style="background: transparent; border: 0; border-bottom: 1px solid transparent; color: #9A948C; padding: 12px 0; font-family: \'Space Grotesk\', sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">'+esc(i?(n||'Altre foto'):'Tutte')+'</button>'}).join(''):'';
  tabs.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-tutte')==='1'?null:b.getAttribute('data-sez');if(v===cur)return;PK.vt(function(){cur=v;filtra()})})});
  griglia.innerHTML=foto.map(function(f,i){return '<button type="button" class="ph" data-i="'+i+'" aria-label="Apri la foto '+(i+1)+'" style="display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 0; background: #161616; cursor: zoom-in; break-inside: avoid; position: relative; overflow: hidden"><img src="'+prev(f,480)+'" alt="" loading="lazy" decoding="async" draggable="false" style="display: block; width: 100%; height: auto; min-height: 120px; transition: opacity .5s; opacity: 0" onload="this.style.opacity=1;this.style.minHeight=0"><span class="ov" style="position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(8,8,8,0.7); color: #E8E4DF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></span></button>'}).join('');
  griglia.querySelectorAll('.ph').forEach(function(b){b.addEventListener('click',function(){lastFocus=b;idx=list.indexOf(foto[+b.getAttribute('data-i')]);mostra()})});
  cur=null;filtra();
}

function filtra(){
  list=foto.filter(function(f){return cur===null||f.sez===cur});
  griglia.querySelectorAll('.ph').forEach(function(b){b.hidden=list.indexOf(foto[+b.getAttribute('data-i')])<0});
  tabs.querySelectorAll('button').forEach(function(t){var on=(t.getAttribute('data-tutte')==='1'&&cur===null)||(t.getAttribute('data-tutte')==='0'&&t.getAttribute('data-sez')===cur);
    t.setAttribute('aria-pressed',on);t.style.color=on?'#E8E4DF':'#9A948C';t.style.borderBottomColor=on?'#B46428':'transparent'});
  d.querySelector('[data-count]').textContent=list.length;
  zip.href=q('/zip',cur?'&p='+encodeURIComponent('/'+cur):'');
  zipT.textContent=cur?'Scarica la sezione in HD':'Scarica tutto in HD';
}

function p2(n){return String(n).padStart(2,'0')}
function mostra(){
  var f=list[idx];if(!f)return;
  big.src=prev(f,1600);dl.href=orig(f);dl.setAttribute('download',f.n);
  pos.textContent=p2(idx+1)+' / '+p2(list.length)+(f.sez?' · '+f.sez:'');
  if(box.hidden){box.hidden=false;d.documentElement.classList.add('menu-open','g-lbx');try{history.pushState({foto:1},'')}catch(e){}}
  var n=list[(idx+1)%list.length];if(n)(new Image()).src=prev(n,1600);
  box.querySelector('[aria-label="Chiudi"]').focus();
}
/* Chiudere la foto: X, Esc o il tasto indietro del telefono (la foto aperta è un passo della cronologia) */
function chiudiOra(){if(box.hidden)return;box.hidden=true;idx=-1;big.removeAttribute('src');d.documentElement.classList.remove('menu-open','g-lbx');if(lastFocus)lastFocus.focus({preventScroll:true})}
function chiudi(){if(history.state&&history.state.foto)history.back();else chiudiOra()}
w.addEventListener('popstate',function(){chiudiOra()});
PK.acts.close=chiudi;
PK.acts.prev=function(){idx=(idx-1+list.length)%list.length;mostra()};
PK.acts.next=function(){idx=(idx+1)%list.length;mostra()};
d.addEventListener('keydown',function(e){if(box.hidden)return;if(e.key==='Escape')chiudi();else if(e.key==='ArrowLeft')PK.acts.prev();else if(e.key==='ArrowRight')PK.acts.next()});
/* scorrimento col dito nella foto ingrandita */
var x0=null;box.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
box.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)(dx<0?PK.acts.next:PK.acts.prev)()});

PK.acts.enter=function(){apri(input.value)};
input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();apri(input.value)}});
var c=new URLSearchParams(location.search).get('c');
if(!c){try{c=sessionStorage.getItem('pk-galleria')}catch(e){}}
if(c){input.value=c;apri(c)}
})();
</script>
