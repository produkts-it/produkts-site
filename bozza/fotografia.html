</button>
</div>
<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px 40px">
<button type="button" data-act="prev" aria-label="Foto precedente" style="width: 52px; height: 52px; flex: none; background: transparent; border: 0; color: #E8E4DF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div class="big" style="height: 100%; max-height: 78vh; max-width: 100%; aspect-ratio: 3 / 2; background: #161616; display: flex; align-items: flex-end; padding: 18px; box-sizing: border-box; font-size: 13px; letter-spacing: 0.1em; color: #6E6A64"></div>
<button type="button" data-act="next" aria-label="Foto successiva" style="width: 52px; height: 52px; flex: none; background: transparent; border: 0; color: #E8E4DF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>

</div>
</div>
</div>
<script src="assets/site.js?v=97dfc7e4"></script>
<script>
(function(){
var d=document,items=[].slice.call(d.querySelectorAll('button.ph')),attr='data-cat',withCat=true,cur='Tutte',list=items,idx=-1;
var box=d.querySelector('[data-if="lightbox"]'),pos=box.querySelector('[style*="tabular-nums"]'),big=box.querySelector('.big'),lastFocus=null;
function apply(){
  list=items.filter(function(p){return cur==='Tutte'||p.getAttribute(attr)===cur});
  items.forEach(function(p){p.classList.remove('stag');p.hidden=list.indexOf(p)<0});
  d.querySelectorAll('[data-act^="cat:"]').forEach(function(t){var on=t.getAttribute('data-act')==='cat:'+cur;
    t.setAttribute('aria-pressed',on);t.style.color=on?'#E8E4DF':'#9A948C';t.style.borderBottomColor=on?'#B46428':'transparent'});
  d.querySelector('[data-count]').textContent=list.length;
}
function p2(n){return String(n).padStart(2,'0')}
function show(){
  var p=list[idx],nb=big.cloneNode(false);
  nb.style.aspectRatio=p.getAttribute('data-ratio');nb.textContent=p.getAttribute('data-label');big.replaceWith(nb);big=nb;
  pos.textContent=p2(idx+1)+' / '+p2(list.length)+(withCat?' · '+p.getAttribute(attr):'');
  box.hidden=false;d.documentElement.classList.add('menu-open');
}
function close(){box.hidden=true;idx=-1;d.documentElement.classList.remove('menu-open');if(lastFocus)lastFocus.focus()}
PK.acts.cat=function(c){if(c===cur)return;PK.vt(function(){cur=c;apply()})};
PK.acts.open=function(a,el){lastFocus=el;idx=list.indexOf(el);show();box.querySelector('[aria-label="Chiudi"]').focus()};
PK.acts.close=close;
PK.acts.prev=function(){idx=(idx-1+list.length)%list.length;show()};
PK.acts.next=function(){idx=(idx+1)%list.length;show()};
d.addEventListener('keydown',function(e){if(box.hidden)return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')PK.acts.prev();else if(e.key==='ArrowRight')PK.acts.next()});

})();
</script>
</body>
</html>
